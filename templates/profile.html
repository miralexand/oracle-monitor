{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>修改密码</h1><p class="subtitle">当前用户：{{ current_user.username }}</p></div>
</div>

<section class="panel" style="max-width:520px">
  <form class="js-hash" method="post">
    <div class="form-grid">
      <label class="field"><span>新密码 *（至少 4 位）</span>
        <input type="password" name="password" required minlength="4" data-hash="1" autocomplete="new-password">
      </label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</section>
{% endblock %}
