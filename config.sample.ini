[oracle]
# 数据库主机（IP 或域名）
host = 192.168.1.100
# 监听端口
port = 1521
# 服务名（SERVICE_NAME）或 SID
service_name = ORCL
# 或使用 SID 方式（与 service_name 二选一）
# sid = ORCL
# 监控账号
user = monitor_user
password = your_password
# 连接超时（秒）
connect_timeout = 10

[smtp]
# SMTP 服务器地址
server = smtp.qq.com
# 端口：465 (SSL) / 587 (TLS) / 25 (明文，不推荐)
port = 465
# 加密方式：ssl / tls / none
encryption = ssl
# 发件人邮箱
sender = monitor@example.com
# 发件人授权码（不是登录密码！）
password = xxxxxxxxxxxxxxxx
# 收件人（多个用英文逗号分隔）
receivers = dba@example.com,ops@example.com
# 邮件主题前缀
subject_prefix = [Oracle监控]

[thresholds]
# 表空间使用率告警阈值（百分比）
tablespace_usage_pct = 85
# 活跃会话数阈值
session_count = 500
# 长事务运行秒数阈值
long_query_seconds = 3600
# 锁等待秒数阈值
lock_wait_seconds = 300
# 归档目录使用率阈值（百分比）
archive_usage_pct = 85
# RMAN 备份允许的最大间隔（小时）
rman_backup_interval_hours = 24
# 告警日志中需要关注的错误关键字（英文逗号分隔）
alert_log_patterns = ORA-00600,ORA-07445,ORA-04031,ORA-01555,ORA-00257,ORA-16038

[modules]
# 是否启用各监控项，true / false
enable_m1_connectivity = true
enable_m2_instance_status = true
enable_m3_tablespace = true
enable_m4_session_count = true
enable_m5_long_query = true
enable_m6_lock_wait = true
enable_m7_archive_space = false
enable_m8_rman_backup = false
enable_m9_alert_log = false

[schedule]
# 检测间隔（分钟），默认 15 分钟以降低数据库轮询压力
interval_minutes = 15

[logging]
# 日志级别：DEBUG / INFO / WARNING / ERROR
level = INFO
# 日志目录
dir = logs
# 日志保留天数（0 表示不清理）
retention_days = 30

[alert]
# 恢复后是否发送恢复通知
notify_on_recovery = true
# 同一告警静默期（分钟），避免刷屏
silence_minutes = 30
